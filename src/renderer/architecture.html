<div class="architecture-container state-view" id="architecture-main-container">
    <div id="arch-restore-banner" class="arch-restore-banner hidden">
        <div class="banner-content">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            <span id="banner-text">Viewing historical version.</span>
        </div>
        <div class="banner-actions">
            <button id="btn-cancel-restore" class="btn-banner-secondary">Cancel</button>
            <button id="btn-confirm-restore" class="btn-banner-primary">Restore This Version</button>
        </div>
    </div>

    <header class="arch-header">
        <div class="arch-title-group">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <h2 id="arch-doc-title">Loading Document...</h2>
        </div>
        
        <div class="arch-controls">
            <span id="arch-save-status" class="save-status">Synced</span>
            
            <button id="btn-delete-doc" class="btn-history-toggle" title="Delete Master Document" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                Delete
            </button>

            <div class="history-dropdown-wrapper">
                <button id="btn-arch-history" class="btn-history-toggle" title="View Version History">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </button>
                <div id="history-dropdown-menu" class="history-dropdown-menu">
                    <div class="history-header">Version Ledger</div>
                    <div id="history-list" class="history-list">
                        </div>
                </div>
            </div>
            
            <div class="segmented-control">
                <button class="segment-btn" data-state="state-edit" title="Edit Only">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="segment-btn" data-state="state-split" title="Split View">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                </button>
                <button class="segment-btn active" data-state="state-view" title="Read Only">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>
    </header>

    <nav class="arch-category-nav">
        <div class="arch-nav-top-row">
            <div class="arch-nav-clusters">
                <div class="arch-menu-container">
                    <div class="arch-menu-button-group">
                        <button class="arch-category-btn" data-doc-type="Specification">
                            Functional Specification
                        </button>
                        <button class="arch-search-icon-btn" data-doc-type="Specification" title="Search Specifications">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                    <div class="search-shade" id="shade-specification">
                        <div class="shade-header">
                            <input type="text" class="typeahead-input" placeholder="Filter specifications..." data-target="Specification">
                        </div>
                        <ul class="shade-results-list" id="results-specification">
                            </ul>
                    </div>
                </div>

                <div class="arch-menu-container">
                    <div class="arch-menu-button-group">
                        <button class="arch-category-btn" data-doc-type="Roadmap">
                            Development Roadmap
                        </button>
                        <button class="arch-search-icon-btn" data-doc-type="Roadmap" title="Search Roadmaps">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                    <div class="search-shade" id="shade-roadmap">
                        <div class="shade-header">
                            <input type="text" class="typeahead-input" placeholder="Filter roadmaps..." data-target="Roadmap">
                        </div>
                        <ul class="shade-results-list" id="results-roadmap">
                            </ul>
                    </div>
                </div>

                <div class="arch-menu-container">
                    <div class="arch-menu-button-group">
                        <button class="arch-category-btn" data-doc-type="Constraint">
                            System Constraints
                        </button>
                        <button class="arch-search-icon-btn" data-doc-type="Constraint" title="Search Constraints">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                    <div class="search-shade" id="shade-constraint">
                        <div class="shade-header">
                            <input type="text" class="typeahead-input" placeholder="Filter constraints..." data-target="Constraint">
                        </div>
                        <ul class="shade-results-list" id="results-constraint">
                            </ul>
                    </div>
                </div>

                <div class="arch-menu-container">
                    <div class="arch-menu-button-group">
                        <button class="arch-category-btn" data-doc-type="Template">
                            Templates
                        </button>
                        <button class="arch-search-icon-btn" data-doc-type="Template" title="Search Templates">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                    <div class="search-shade" id="shade-template">
                        <div class="shade-header">
                            <input type="text" class="typeahead-input" placeholder="Filter templates..." data-target="Template">
                        </div>
                        <ul class="shade-results-list" id="results-template">
                            </ul>
                    </div>
                </div>
            </div>

            <div class="arch-nav-actions" style="display: flex; gap: 12px; align-items: center;">
                <button id="btn-close-doc" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; transition: background-color 0.2s ease;" onmouseover="this.style.backgroundColor='var(--surface-color)'" onmouseout="this.style.backgroundColor='transparent'" title="Close Current Document">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    Close Document
                </button>
                <button id="btn-new-doc" class="btn-create-doc" title="Create New Architecture Document">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Document
                </button>
            </div>
        </div>

        <div class="arch-search-replace-bar" id="arch-search-replace-bar">
            <div class="search-input-group">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="editor-find-input" placeholder="Find..." autocomplete="off">
                <button id="btn-toggle-regex" class="btn-search-toggle" title="Use Regular Expression (.*)">.*</button>
                <span id="editor-find-counter" class="find-counter">0/0</span>
                <div class="search-nav-controls">
                    <button id="btn-find-prev" title="Previous Match (Shift+Enter)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
                    <button id="btn-find-next" title="Next Match (Enter)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                </div>
            </div>
            
            <div class="search-input-group">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                <input type="text" id="editor-replace-input" placeholder="Replace with..." autocomplete="off">
            </div>
            
            <div class="search-replace-actions">
                <button id="btn-replace-current" class="btn-replace">Replace</button>
                <button id="btn-replace-all" class="btn-replace">Replace All</button>
            </div>
        </div>
    </nav>

    <div class="arch-workspace">
        <div class="arch-pane arch-editor-pane">
            <div id="arch-backdrop" class="arch-backdrop"></div>
            <textarea id="arch-editor" class="arch-textarea" placeholder="Define your architectural rules here using Markdown..."></textarea>
        </div>

        <div class="arch-divider" id="arch-divider"></div>

        <div class="arch-pane arch-viewer-pane">
            <div id="arch-viewer" class="markdown-body"></div>
        </div>
    </div>

    <div id="create-doc-modal" class="arch-modal-overlay hidden">
        <div class="arch-modal-content">
            <div class="arch-modal-header">
                <h3>Create Architecture Document</h3>
            </div>
            <div class="arch-modal-body">
                <div class="form-group">
                    <label for="new-doc-title">Document Title</label>
                    <input type="text" id="new-doc-title" class="arch-input" placeholder="e.g., Phase 6 Security Protocols" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="new-doc-type">Document Type</label>
                    <select id="new-doc-type" class="arch-select">
                        <option value="Specification">Functional Specification</option>
                        <option value="Roadmap">Development Roadmap</option>
                        <option value="Constraint">System Constraint</option>
                        <option value="Template">Template</option>
                    </select>
                </div>
            </div>
            <div class="arch-modal-actions">
                <button id="btn-cancel-create" class="btn-modal-secondary">Cancel</button>
                <button id="btn-confirm-create" class="btn-modal-primary">Create Document</button>
            </div>
        </div>
    </div>
</div>
